apiVersion: 1

datasources:
  - name: PostgreSQL-CrossVerify
    type: postgres
    access: proxy
    url: postgres:5432
    database: crossverify
    user: postgres
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1600
    secureJsonData:
      password: postgres
    isDefault: true
    editable: true

